<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Zeta Kuis - Panel Admin</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="atas">
    <div class="brand-kiri">
      <img id="brand-logo-admin" src="/logo.ico" alt="" onerror="this.style.display='none'">
      <strong>ZETA KUIS</strong>
      <span id="titik-koneksi" class="indikator"></span>
      <span id="status-koneksi">Menghubungkan...</span>
    </div>
    <div class="info" id="info-soal"></div>
    <div class="info" id="info-skor"></div>
  </header>

  <div id="toast"></div>

  <main>
    <section id="mode-setup" class="mode aktif">
      <div class="kartu">
        <h2>Pengaturan Permainan</h2>
        <label class="judul-kecil" for="input-tim-a">Nama Tim 1</label>
        <input id="input-tim-a" type="text" maxlength="20" autocomplete="off">
        <label class="judul-kecil" for="input-tim-b">Nama Tim 2</label>
        <input id="input-tim-b" type="text" maxlength="20" autocomplete="off">
        <p class="bantuan">Soal tanpa batas jumlah. Tiap soal: pertanyaan (dibacakan juri, tidak tampil di laptop) + 4 opsi + 1 kunci.</p>
        <div id="daftar-soal"></div>
        <button id="tombol-tambah-soal" type="button">+ Tambah Soal</button>
        <button id="tombol-mulai" type="button" class="primer">MULAI PERMAINAN</button>
        <p class="bantuan" id="bantuan-giliran"></p>
      </div>
    </section>

    <section id="mode-menjawab" class="mode">
      <div class="kartu">
        <div id="jawab-nomor"></div>
        <div id="jawab-soal"></div>
        <div id="jawab-opsi"></div>
        <div id="jawab-kunci"></div>
        <div id="jawab-penjawab"></div>
        <div id="jawab-sisa"></div>
        <div id="jawab-status">Menunggu jawaban dikunci… (otomatis dinilai)</div>
        <button id="tombol-hint" type="button">Hint: Buang 1 Opsi Salah</button>
      </div>
    </section>

    <section id="mode-hasil" class="mode">
      <div class="kartu">
        <div id="teks-hasil-admin"></div>
        <div id="skor-hasil-admin"></div>
      </div>
    </section>

    <section id="mode-selesai" class="mode">
      <div class="kartu">
        <h2>PERMAINAN SELESAI</h2>
        <div id="teks-pemenang-admin"></div>
        <div id="skor-selesai-admin"></div>
        <button id="tombol-baru" type="button" class="primer">Permainan Baru</button>
      </div>
    </section>
  </main>

  <div id="panel-kontrol" class="sembunyi">
    <button id="tombol-next" type="button">Next Soal</button>
    <button id="tombol-akhiri" type="button" class="bahaya">Akhiri Permainan</button>
  </div>

  <div id="modal-hint">
    <div class="kartu">
      <div id="modal-hint-teks">Pilih 1 opsi SALAH untuk dibuang (benar setelah hint hanya +5):</div>
      <div id="modal-hint-tombol"></div>
      <button id="modal-hint-batal" type="button">Batal</button>
    </div>
  </div>

  <div id="modal-akhir">
    <div class="kartu">
      <div id="modal-teks"></div>
      <div id="modal-tombol"></div>
      <button id="modal-batal" type="button">Batal</button>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
